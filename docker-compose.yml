# PostgreSQL local para desenvolvimento (mesma versão major do Supabase).
# Subir: npm run db:up   |   Parar: npm run db:down
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projeto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
