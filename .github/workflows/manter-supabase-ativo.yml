# O plano gratuito do Supabase pausa projetos após 1 semana sem uso.
# Este workflow chama /api/health de cada ambiente a cada 3 dias, o que faz uma consulta ao banco.
#
# Configure em: Settings > Secrets and variables > Actions > Variables
#   HEALTH_URLS = https://projeto-api-dev.vercel.app/api/health https://projeto-api-qa.vercel.app/api/health https://projeto-api.vercel.app/api/health
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping nos ambientes
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/health
        env:
          HEALTH_URLS: ${{ vars.HEALTH_URLS }}
        run: |
          if [ -z "$HEALTH_URLS" ]; then
            echo "::notice::Variável HEALTH_URLS não configurada; nada a fazer."
            exit 0
          fi
          FALHOU=0
          for URL in $HEALTH_URLS; do
            echo "-> $URL"
            curl -sS --max-time 30 "$URL" || FALHOU=1
            echo
          done
          exit $FALHOU
